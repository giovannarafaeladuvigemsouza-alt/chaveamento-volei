name: Aplicar migrations do Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Aplicar migrations em produção
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validar secrets obrigatórios
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Falta o secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Falta o secret SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Falta o secret SUPABASE_PROJECT_ID"; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo "Falta o secret SUPABASE_DB_URL (Session pooler)"; exit 1; }

      - name: Vincular projeto Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Aplicar migrations pendentes
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

